[tools]
node = "24"

[tasks.compile]
description = "Compile TypeScript"
run = "npm run compile"

[tasks."bundle-mcp"]
description = "Bundle MCP server with dependencies"
run = "npm run bundle:mcp"

[tasks.build]
description = "Compile TypeScript and bundle MCP server"
depends = ["compile", "bundle-mcp"]

[tasks.watch]
description = "Compile TypeScript in watch mode"
run = "npm run watch"

[tasks.dev]
description = "Launch extension in watch mode"
run = "npm run watch"

[tasks.package]
description = "Build VSIX package to dist/. Pass version as argument: mise run package 0.3.0"
run = """
#!/usr/bin/env bash
set -e

CURRENT_VERSION=$(node -p "require('./package.json').version")

if [ -n "$1" ]; then
  NEW_VERSION="$1"
elif [ -t 0 ]; then
  echo "Current version: $CURRENT_VERSION"
  echo ""
  echo "Enter new version (or press Enter to keep $CURRENT_VERSION):"
  read -r NEW_VERSION
  NEW_VERSION="${NEW_VERSION:-$CURRENT_VERSION}"
else
  NEW_VERSION="$CURRENT_VERSION"
fi

if [ "$NEW_VERSION" != "$CURRENT_VERSION" ]; then
  npm version "$NEW_VERSION" --no-git-tag-version
  echo "Version bumped to $NEW_VERSION"
fi

# Build after potential version bump (MCP server version is inlined from package.json)
echo "Building..."
npm run compile
npm run bundle:mcp

echo "Packaging..."
mkdir -p dist
npx --yes @vscode/vsce package --allow-missing-repository --out "dist/mytodos-${NEW_VERSION}.vsix"

echo ""
echo "Built: dist/mytodos-${NEW_VERSION}.vsix"
"""

[tasks.install]
description = "Install latest VSIX into VS Code. Pass version as argument: mise run install 0.3.0"
run = """
#!/usr/bin/env bash
set -e
if [ -n "$1" ]; then
  VSIX="dist/mytodos-$1.vsix"
else
  VSIX=$(ls -t dist/*.vsix 2>/dev/null | head -1)
fi
if [ -z "$VSIX" ] || [ ! -f "$VSIX" ]; then
  echo "No VSIX found. Run 'mise run package' first."
  exit 1
fi
echo "Installing $VSIX..."
code --install-extension "$VSIX" --force
echo "Installed. Reload VS Code to activate."
"""
